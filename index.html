<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quanto Sei Grato/a Davvero? | Il Caffè del Lunedì Mattina</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0f1623;
    --card: #1a2236;
    --card2: #1e2a40;
    --accent: #4f8ef7;
    --accent2: #7bb3ff;
    --accent-glow: rgba(79,142,247,0.18);
    --text: #e8eef8;
    --text-muted: #8da0be;
    --border: rgba(79,142,247,0.18);
    --success: #4fd1a0;
    --danger: #f76f6f;
    --bar-bg: rgba(79,142,247,0.12);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 20px 16px 60px;
    background-image: radial-gradient(ellipse at 20% 20%, rgba(79,142,247,0.07) 0%, transparent 60%),
                      radial-gradient(ellipse at 80% 80%, rgba(123,179,255,0.05) 0%, transparent 60%);
  }

  .header { text-align: center; margin-bottom: 36px; margin-top: 16px; }

  .brand {
    font-size: 12px; font-weight: 600; letter-spacing: 2.5px; text-transform: uppercase;
    color: var(--accent); margin-bottom: 6px; opacity: 0.9;
  }

  .caffè-number {
    font-size: 11px; color: var(--text-muted); letter-spacing: 1.5px; text-transform: uppercase; margin-bottom: 20px;
  }

  h1 {
    font-family: 'Playfair Display', serif; font-size: clamp(28px, 7vw, 46px); font-weight: 900;
    line-height: 1.1; color: var(--text); margin-bottom: 14px;
  }

  h1 span { color: var(--accent); }

  .subtitle { font-size: 15px; color: var(--text-muted); line-height: 1.6; max-width: 400px; margin: 0 auto; }

  .quiz-card {
    background: var(--card); border: 1px solid var(--border); border-radius: 20px; padding: 32px 28px;
    max-width: 560px; width: 100%;
    box-shadow: 0 8px 40px rgba(0,0,0,0.35), 0 0 0 1px rgba(79,142,247,0.06);
  }

  .progress-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 18px; }
  .q-counter { font-size: 12px; color: var(--text-muted); font-weight: 500; letter-spacing: 0.5px; }
  .progress-bar-wrap { flex: 1; height: 4px; background: var(--bar-bg); border-radius: 99px; margin: 0 14px; overflow: hidden; }
  .progress-bar-fill {
    height: 100%; background: linear-gradient(90deg, var(--accent), var(--accent2)); border-radius: 99px;
    transition: width 0.4s cubic-bezier(.4,0,.2,1); width: 0%;
  }
  .q-score { font-size: 12px; color: var(--accent); font-weight: 600; }

  .question-block { animation: fadeUp 0.35s ease both; }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(14px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .q-num { font-size: 11px; font-weight: 700; letter-spacing: 2px; text-transform: uppercase; color: var(--accent); margin-bottom: 10px; }
  .q-scenario-label { font-size: 10px; font-weight: 600; letter-spacing: 2px; text-transform: uppercase; color: var(--text-muted); margin-bottom: 6px; }
  .q-text {
    font-family: 'Playfair Display', serif; font-size: clamp(16px, 4vw, 19px); font-weight: 700;
    line-height: 1.45; color: var(--text); margin-bottom: 26px;
  }

  .options { display: flex; flex-direction: column; gap: 10px; }

  .option-btn {
    background: var(--card2); border: 1.5px solid var(--border); border-radius: 12px; padding: 14px 18px;
    text-align: left; cursor: pointer; font-family: 'DM Sans', sans-serif; font-size: 14px; color: var(--text);
    line-height: 1.5; transition: all 0.2s ease; display: flex; align-items: flex-start; gap: 12px;
  }
  .option-btn:hover { border-color: var(--accent); background: rgba(79,142,247,0.08); transform: translateX(3px); }
  .option-btn.selected { border-color: var(--accent); background: rgba(79,142,247,0.13); box-shadow: 0 0 0 3px rgba(79,142,247,0.1); }

  .option-letter {
    width: 24px; height: 24px; border-radius: 50%; background: var(--bar-bg); border: 1.5px solid var(--border);
    display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 700; color: var(--accent);
    flex-shrink: 0; margin-top: 1px; transition: all 0.2s;
  }
  .option-btn.selected .option-letter { background: var(--accent); border-color: var(--accent); color: #fff; }
  .option-text { flex: 1; }

  .next-btn {
    margin-top: 24px; width: 100%; background: linear-gradient(135deg, var(--accent), var(--accent2)); color: #fff;
    border: none; border-radius: 12px; padding: 15px 24px; font-family: 'DM Sans', sans-serif; font-size: 15px;
    font-weight: 600; cursor: pointer; transition: all 0.2s ease; display: none; box-shadow: 0 4px 20px rgba(79,142,247,0.3);
  }
  .next-btn:hover { transform: translateY(-2px); box-shadow: 0 8px 30px rgba(79,142,247,0.45); }
  .next-btn.visible { display: block; }

  .result-block { display: none; animation: fadeUp 0.4s ease both; }
  .result-block.visible { display: block; }

  .result-badge {
    display: inline-flex; align-items: center; gap: 8px; background: rgba(79,142,247,0.12); border: 1px solid var(--border);
    border-radius: 99px; padding: 6px 16px; font-size: 11px; font-weight: 700; letter-spacing: 1.5px;
    text-transform: uppercase; color: var(--accent); margin-bottom: 18px;
  }
  .result-title { font-family: 'Playfair Display', serif; font-size: clamp(22px, 6vw, 32px); font-weight: 900; line-height: 1.15; margin-bottom: 6px; color: var(--text); }
  .result-score-line { font-size: 13px; color: var(--text-muted); margin-bottom: 20px; }
  .result-score-line strong { color: var(--accent); }
  .result-desc { font-size: 15px; line-height: 1.7; color: var(--text-muted); margin-bottom: 20px; border-left: 3px solid var(--accent); padding-left: 16px; }
  .result-action {
    background: rgba(79,142,247,0.07); border: 1px solid var(--border); border-radius: 12px; padding: 16px 18px;
    font-size: 14px; line-height: 1.6; color: var(--text); margin-bottom: 24px;
  }
  .result-action strong { display: block; font-size: 11px; letter-spacing: 1.5px; text-transform: uppercase; color: var(--accent); margin-bottom: 6px; }

  .retry-btn {
    width: 100%; background: transparent; border: 1.5px solid var(--border); border-radius: 12px; padding: 13px 24px;
    font-family: 'DM Sans', sans-serif; font-size: 14px; font-weight: 600; color: var(--text-muted); cursor: pointer; transition: all 0.2s;
  }
  .retry-btn:hover { border-color: var(--accent); color: var(--accent); }

  .footer { margin-top: 32px; text-align: center; font-size: 12px; color: var(--text-muted); opacity: 0.6; }
  .footer a { color: var(--accent); text-decoration: none; opacity: 0.8; }
</style>
</head>
<body>

<div class="header">
  <div class="brand">☕ Il Caffè del Lunedì Mattina</div>
  <div class="caffè-number">· #31 ·</div>
  <h1>Quanto sei grato/a<br><span>davvero?</span></h1>
  <p class="subtitle">5 scenari concreti. Giornate storte, persone care, quello che hai già: scopri quanto la gratitudine fa parte della tua vita.</p>
</div>

<div class="quiz-card" id="quizCard">

  <div class="progress-row">
    <span class="q-counter" id="qCounter">Domanda 1 di 5</span>
    <div class="progress-bar-wrap">
      <div class="progress-bar-fill" id="progressBar"></div>
    </div>
    <span class="q-score" id="scoreDisplay">0 pt</span>
  </div>

  <div class="question-block" id="questionBlock">
    <div class="q-num" id="qNum">01 —</div>
    <div class="q-scenario-label">Scenario</div>
    <div class="q-text" id="qText"></div>
    <div class="options" id="optionsContainer"></div>
    <button class="next-btn" id="nextBtn" onclick="nextQuestion()">Prossima domanda →</button>
  </div>

  <div class="result-block" id="resultBlock">
    <div class="result-badge">🙏 Il tuo profilo</div>
    <div class="result-title" id="resultTitle"></div>
    <div class="result-score-line" id="resultScoreLine"></div>
    <div class="result-desc" id="resultDesc"></div>
    <div class="result-action" id="resultAction"></div>
    <button class="retry-btn" onclick="restartQuiz()">↩ Rifai il test</button>
  </div>

</div>

<div class="footer">
  Con Affetto — Teo ☕ &nbsp;·&nbsp; <a href="https://uno-come-voi.com" target="_blank">uno-come-voi.com</a>
</div>

<script>
const questions = [
  {
    num: "01",
    scenario: "Scenario",
    text: "È stata una giornata pesante. La sera, prima di dormire, ripensi a com'è andata. Cosa ti viene in mente?",
    options: [
      { letter: "A", text: "Solo quello che è andato storto. Lo rivedo in testa come un film.", points: 0 },
      { letter: "B", text: "Mi lamento un po', poi mi torna in mente anche qualcosa di bello.", points: 2 },
      { letter: "C", text: "Mi consolo con un \"poteva andare peggio\" e chiudo lì.", points: 1 },
      { letter: "D", text: "Cerco apposta almeno una cosa andata bene, anche piccola: un caffè buono, una risata.", points: 4 }
    ]
  },
  {
    num: "02",
    scenario: "Scenario",
    text: "Una persona vicina a te fa per te una cosa che fa sempre: ti prepara il caffè, ti dà un passaggio, ti chiede come stai. Come reagisci?",
    options: [
      { letter: "A", text: "La ringrazio in modo preciso: \"Grazie, oggi ne avevo proprio bisogno.\"", points: 4 },
      { letter: "B", text: "Un \"grazie\" veloce, mentre penso già ad altro.", points: 2 },
      { letter: "C", text: "Non ci faccio caso: ormai è normale che lo faccia.", points: 0 },
      { letter: "D", text: "Me ne accorgo solo il giorno in cui non lo fa.", points: 1 }
    ]
  },
  {
    num: "03",
    scenario: "Scenario",
    text: "Qualche mese fa hai ottenuto una cosa che desideravi da tempo: un lavoro, una casa, un oggetto, un traguardo. Oggi come la vivi?",
    options: [
      { letter: "A", text: "È diventata normale. Anzi, sto già pensando alla prossima cosa che mi manca.", points: 0 },
      { letter: "B", text: "Ogni tanto mi fermo a ricordare quanto la desideravo, e la apprezzo di nuovo.", points: 4 },
      { letter: "C", text: "Ne vedo soprattutto i difetti e le scocciature.", points: 1 },
      { letter: "D", text: "La apprezzo, ma solo quando qualcuno me lo fa notare.", points: 2 }
    ]
  },
  {
    num: "04",
    scenario: "Scenario",
    text: "Ti torna in mente una persona che anni fa ti ha aiutato davvero: un insegnante, un amico, un ex collega. Cosa fai?",
    options: [
      { letter: "A", text: "Penso \"dovrei scriverle\"… e poi non lo faccio mai.", points: 2 },
      { letter: "B", text: "Mi chiedo perché non si fa più sentire lei.", points: 1 },
      { letter: "C", text: "Le scrivo davvero, anche solo due righe, per dirle grazie.", points: 4 },
      { letter: "D", text: "Sinceramente, non mi viene in mente nessuno che mi abbia aiutato così.", points: 0 }
    ]
  },
  {
    num: "05",
    scenario: "Scenario",
    text: "Guardi il telegiornale: guerre, alluvioni, gente che ha perso tutto. Dopo, cosa ti resta?",
    options: [
      { letter: "A", text: "Cambio canale: non voglio pensarci.", points: 1 },
      { letter: "B", text: "Per un attimo penso \"a me va bene\", poi torno alle mie solite lamentele.", points: 2 },
      { letter: "C", text: "Solo ansia: il mondo va a rotoli e nessuno può farci niente.", points: 0 },
      { letter: "D", text: "Mi accorgo di avere un porto sicuro, e mi viene da dire grazie per quello che ho.", points: 4 }
    ]
  }
];

const results = [
  {
    min: 0, max: 4,
    title: "Lo Sfondo Grigio",
    desc: "In questo periodo quasi tutto quello che hai è diventato \"sfondo\": lo vedi solo quando manca. Non è colpa tua: il cervello è fatto per notare i problemi, non i regali. Ma significa che stai vivendo con meno di quello che hai davvero. La buona notizia? La gratitudine si allena, e si può cominciare stasera.",
    action: "⚡ La tua azione questa settimana: Le tre cose belle. Ogni sera, prima di dormire, scrivi tre cose andate bene oggi. Anche minuscole. Per 7 sere di fila. Stai insegnando al tuo cervello a cercare il bello."
  },
  {
    min: 5, max: 8,
    title: "Il Grazie di Fretta",
    desc: "La gratitudine c'è, ma passa di corsa: un \"grazie\" detto mentre pensi ad altro, un \"poteva andare peggio\" per chiudere il discorso. Le cose belle le vedi, ma non ti fermi abbastanza da sentirle davvero. Ti manca solo una cosa: rallentare quel tanto che basta.",
    action: "⚡ La tua azione questa settimana: Il grazie specifico. Ogni giorno ringrazia una persona dicendo esattamente per cosa: \"Grazie per avermi ascoltato ieri sera, ne avevo bisogno.\" Guarda che faccia fa."
  },
  {
    min: 9, max: 12,
    title: "Il Grato a Intermittenza",
    desc: "Sai apprezzare, e in certi momenti lo fai davvero bene. Ma la gratitudine si accende e si spegne: nelle giornate buone c'è, in quelle storte sparisce. E sono proprio le giornate storte quelle in cui ti servirebbe di più. Ti manca la costanza, non la sensibilità.",
    action: "⚡ La tua azione questa settimana: Il gioco del \"senza\". Scegli una cosa che dai per scontata e immagina per un minuto la tua vita senza. Fallo soprattutto nel giorno più storto della settimana."
  },
  {
    min: 13, max: 16,
    title: "L'Occhio Allenato",
    desc: "Hai l'occhio allenato: vedi le cose belle anche quando la giornata va di traverso, e le persone vicine a te sanno che le apprezzi. La gratitudine è già un'abitudine. Ora puoi fare il passo in più: portarla fuori, verso chi non ha mai saputo quanto conta per te.",
    action: "⚡ La tua azione questa settimana: La lettera mai spedita. Scrivi a una persona che ti ha cambiato la vita e che non hai mai ringraziato davvero. Poi decidi tu se spedirla. (Io un'idea ce l'avrei… 😉)"
  },
  {
    min: 17, max: 20,
    title: "Il Porto Sicuro",
    desc: "Per te la gratitudine non è un esercizio: è un modo di guardare la vita. Sai riconoscere il tuo porto sicuro anche quando fuori c'è tempesta, e lo dici a chi lo rende possibile. Persone come te fanno stare meglio chi gli sta intorno, spesso senza nemmeno accorgersene.",
    action: "⚡ La tua azione questa settimana: Diventa il porto sicuro di qualcun altro. Pensa a chi sta attraversando un periodo difficile e fagli un piccolo gesto, senza aspettarti niente in cambio. E se ti va, rispondi a questa email e raccontami per cosa sei grato/a oggi."
  }
];

let currentQ = 0;
let totalScore = 0;
let selectedPoints = null;

function renderQuestion() {
  const q = questions[currentQ];
  document.getElementById('qCounter').textContent = `Domanda ${currentQ + 1} di ${questions.length}`;
  document.getElementById('qNum').textContent = q.num + ' —';
  document.getElementById('qText').textContent = q.text;
  document.getElementById('progressBar').style.width = `${(currentQ / questions.length) * 100}%`;
  document.getElementById('scoreDisplay').textContent = totalScore + ' pt';

  const container = document.getElementById('optionsContainer');
  container.innerHTML = '';
  q.options.forEach((opt, i) => {
    const btn = document.createElement('button');
    btn.className = 'option-btn';
    btn.innerHTML = `<span class="option-letter">${opt.letter}</span><span class="option-text">${opt.text}</span>`;
    btn.onclick = () => selectOption(i, opt.points, btn);
    container.appendChild(btn);
  });

  selectedPoints = null;
  const nb = document.getElementById('nextBtn');
  nb.classList.remove('visible');
  nb.textContent = currentQ < questions.length - 1 ? 'Prossima domanda →' : 'Scopri il tuo profilo →';

  const qb = document.getElementById('questionBlock');
  qb.style.animation = 'none';
  qb.offsetHeight;
  qb.style.animation = 'fadeUp 0.35s ease both';
}

function selectOption(index, points, btn) {
  document.querySelectorAll('.option-btn').forEach(b => b.classList.remove('selected'));
  btn.classList.add('selected');
  selectedPoints = points;
  document.getElementById('nextBtn').classList.add('visible');
}

function nextQuestion() {
  if (selectedPoints === null) return;
  totalScore += selectedPoints;
  if (currentQ < questions.length - 1) {
    currentQ++;
    renderQuestion();
  } else {
    showResult();
  }
}

function showResult() {
  document.getElementById('questionBlock').style.display = 'none';
  document.getElementById('progressBar').style.width = '100%';
  document.getElementById('qCounter').textContent = `Completato!`;
  document.getElementById('scoreDisplay').textContent = totalScore + ' pt';

  const result = results.find(r => totalScore >= r.min && totalScore <= r.max) || results[results.length - 1];

  document.getElementById('resultTitle').textContent = result.title;
  document.getElementById('resultScoreLine').innerHTML = `Hai totalizzato <strong>${totalScore} punti</strong> su 20`;
  document.getElementById('resultDesc').textContent = result.desc;
  document.getElementById('resultAction').innerHTML = `<strong>⚡ La tua azione questa settimana</strong>${result.action.replace('⚡ La tua azione questa settimana: ', '')}`;

  document.getElementById('resultBlock').classList.add('visible');
}

function restartQuiz() {
  currentQ = 0;
  totalScore = 0;
  selectedPoints = null;
  document.getElementById('questionBlock').style.display = 'block';
  document.getElementById('resultBlock').classList.remove('visible');
  renderQuestion();
}

renderQuestion();
</script>
</body>
</html>
